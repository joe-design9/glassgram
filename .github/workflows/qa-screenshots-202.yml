name: QA Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build QA configuration (Simulator)
        run: |
          xcodebuild \
            -project GlassGram.xcodeproj \
            -scheme GlassGram \
            -configuration QA \
            -sdk iphonesimulator \
            -derivedDataPath build-qa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot a simulator (iPhone 15 Pro Max)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')
          # Joel's QA target device: iPhone 15 Pro Max. Prefer an
          # existing one, else create it from its device type.
          UDID=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" '(.devices[$rt] // []) | map(select(.isAvailable and (.name == "iPhone 15 Pro Max"))) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPhone 15 Pro Max")] | last | .identifier // empty')
            if [ -n "$DEVTYPE" ]; then
              echo "Creating iPhone 15 Pro Max from type: $DEVTYPE on $RUNTIME"
              UDID=$(xcrun simctl create "iPhone 15 Pro Max" "$DEVTYPE" "$RUNTIME")
            fi
          fi
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" '(.devices[$rt] // []) | map(select(.isAvailable and (.name | startswith("iPhone")))) | last | .udid // empty')
          fi
          if [ -z "$UDID" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("^iPhone (1[6-9]|2[0-9])"))] | sort_by(.name) | last | .identifier')
            echo "Creating device from type: $DEVTYPE on $RUNTIME"
            UDID=$(xcrun simctl create QA-iPhone "$DEVTYPE" "$RUNTIME")
          fi
          xcrun simctl list devices -j | jq -r --arg u "$UDID" '[.devices[][] | select(.udid == $u) | .name] | first' | xargs -I{} echo "QA device: {}"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and capture screens
        run: |
          mkdir -p shots
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          APP=$(find build-qa/Build/Products -name "GlassGram.app" -type d | head -1)
          echo "App: $APP"
          xcrun simctl uninstall "$UDID" dev.joe.glassgram || true
          xcrun simctl install "$UDID" "$APP"
          # 1) The REAL first screen: plain launch on a fresh
          # install, no seed args -> the registration screen.
          xcrun simctl launch "$UDID" dev.joe.glassgram
          sleep 7
          xcrun simctl io "$UDID" screenshot shots/registration.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 2) The REAL empty state: activated account, zero chats.
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode -QAEmptyState
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/empty.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 3) Seeded chat list.
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/chats.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 4) Open chat + scripted send flow (keyboard behaviour).
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode -UITestScreen chat -QASendFlow
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/chat.png
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/sendflow1.png
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/sendflow2.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 5) Contacts.
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode -UITestScreen contacts
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/contacts.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 6) Settings.
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode -UITestScreen settings
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/settings.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          # 7) Calls (empty state — a real first screen).
          xcrun simctl launch "$UDID" dev.joe.glassgram -UITestMode -UITestScreen calls
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/calls.png
          xcrun simctl terminate "$UDID" dev.joe.glassgram || true
          ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: glassgram-qa-screenshots
          path: shots/
