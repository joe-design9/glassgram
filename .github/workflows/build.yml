name: Build IPA

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPAs (normal + admin)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build GlassGram (normal, unsigned)
        run: |
          xcodebuild \
            -project GlassGram.xcodeproj \
            -scheme GlassGram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build-normal" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package GlassGram-2.0.2.ipa
        run: |
          APP_PATH="build-normal/Build/Products/Release-iphoneos/GlassGram.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build-normal -name "*.app" -maxdepth 5
            exit 1
          fi
          rm -rf Payload GlassGram-2.0.2.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GlassGram-2.0.2.ipa Payload
          ls -lh GlassGram-2.0.2.ipa

      - name: Build GlassGram Admin (unsigned)
        run: |
          xcodebuild \
            -project GlassGram.xcodeproj \
            -scheme GlassGramAdmin \
            -configuration ReleaseAdmin \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build-admin" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package GlassGram-Admin-2.0.2.ipa
        run: |
          APP_PATH="build-admin/Build/Products/ReleaseAdmin-iphoneos/GlassGram.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build-admin -name "*.app" -maxdepth 5
            exit 1
          fi
          rm -rf Payload GlassGram-Admin-2.0.2.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GlassGram-Admin-2.0.2.ipa Payload
          ls -lh GlassGram-Admin-2.0.2.ipa

      - name: Upload IPAs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassGram-ipas
          path: |
            GlassGram-2.0.2.ipa
            GlassGram-Admin-2.0.2.ipa
          if-no-files-found: error

      - name: Attach IPAs to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GlassGram-2.0.2.ipa
            GlassGram-Admin-2.0.2.ipa
